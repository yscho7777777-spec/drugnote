<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>원결 양약 노트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{--bg:#f5f7f8;--surface:#fff;--ink:#16232c;--muted:#5a6a75;--line:#dbe3e8;--accent:#1d5d78;--accent-soft:#e2eef3;--warn:#a8402a}
@media (prefers-color-scheme: dark){:root{--bg:#0e161b;--surface:#152028;--ink:#e3eaee;--muted:#93a3ae;--line:#24323b;--accent:#74b9d4;--accent-soft:#16303b;--warn:#f19274;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;display:grid;place-items:center;padding:16px}
form{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font:700 1.45rem/1.2 "Gowun Batang",serif}
p{margin:0;color:var(--muted);font-size:.88rem}
label.f{font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=password]{width:100%;font:500 1.05rem inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
button{border:0;border-radius:10px;background:var(--accent);color:var(--surface);font:600 1rem inherit;padding:12px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--warn);font-size:.88rem;min-height:1.4em}
</style>
</head>
<body>
<form id="f" autocomplete="off">
  <h1>원결 양약 노트</h1>
  <p>원결지기 진료실 전용 자료입니다.</p>
  <div><label class="f" for="pw">비밀번호</label>
  <input id="pw" type="password" autocomplete="current-password" required></div>
  <label class="row"><input id="keep" type="checkbox" checked> 이 기기에서 기억하기</label>
  <button id="go" type="submit">열기</button>
  <div class="err" id="err" role="alert"></div>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const KEYNAME='wg-drugnote-key-'+P.v;
async function decryptWith(key){
  const buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.iv)},key,b64(P.ct));
  return new TextDecoder().decode(buf);
}
function show(html){ document.open(); document.write(html); document.close(); }
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
(async()=>{
  try{
    const saved=localStorage.getItem(KEYNAME);
    if(saved){
      const key=await crypto.subtle.importKey('jwk',JSON.parse(saved),{name:'AES-GCM'},true,['decrypt']);
      show(await decryptWith(key)); return;
    }
  }catch(e){ try{localStorage.removeItem(KEYNAME)}catch(_){} }
  document.getElementById('pw').focus();
})();
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go'), err=document.getElementById('err');
  btn.disabled=true; err.textContent='여는 중…';
  try{
    const key=await derive(document.getElementById('pw').value);
    const html=await decryptWith(key);
    if(document.getElementById('keep').checked){
      try{ localStorage.setItem(KEYNAME,JSON.stringify(await crypto.subtle.exportKey('jwk',key))); }catch(_){}
    }
    show(html);
  }catch(_){
    err.textContent='비밀번호가 맞지 않습니다.'; btn.disabled=false;
    document.getElementById('pw').select();
  }
});
</script>
